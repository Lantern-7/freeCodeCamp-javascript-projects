<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="weather-container">
    <h1>Weather Now</h1>
    
    <div class="controls">
      <select id="city-select">
        <option value=""></option>
        <option value="new york">New York</option>
        <option value="los angeles">Los Angeles</option>
        <option value="chicago">Chicago</option>
        <option value="paris">Paris</option>
        <option value="tokyo">Tokyo</option>
        <option value="london">London</option>
      </select>
      <button id="get-weather-btn">Get Weather</button>
    </div>

    <div id="weather-display" class="weather-card">
      <img id="weather-icon" src="" alt="Weather Icon" />
      <h2 id="location"></h2>
      <p class="weather-main" id="weather-main"></p>
      
      <div class="temps">
        <p>Temp: <span id="main-temperature"></span> °C</p>
        <p>Feels like: <span id="feels-like"></span> °C</p>
      </div>
      
      <div class="details">
        <p>Humidity: <span id="humidity"></span> %</p>
        <p>Wind: <span id="wind"></span> m/s</p>
        <p>Gust: <span id="wind-gust"></span> m/s</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
